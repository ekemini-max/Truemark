# Render Blueprint: one free web service built from the Dockerfile.
# Render -> New -> Blueprint -> pick this repository. Then fill in the variables marked sync: false.
services:
  - type: web
    name: truemark
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BASE_URL
        sync: false          # your live address, for example https://truemark.onrender.com
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CHAIN_MODE
        value: mock           # change to mock to run without a blockchain
      - key: CHAIN_NAME
        value: Polygon Amoy testnet
      - key: CHAIN_ID
        value: "80002"
      - key: EXPLORER_TX_URL
        value: https://amoy.polygonscan.com/tx/
      - key: EXPLORER_ADDRESS_URL
        value: https://amoy.polygonscan.com/address/
      - key: RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: ISSUER_PRIVATE_KEY
        sync: false
