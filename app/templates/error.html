{% extends "base.html" %}
{% block title %}{{ title }}, TrueMark{% endblock %}

{% block content %}
<div class="wrap page">
  <div class="page-head"><div><h1>{{ title }}</h1><p class="measure">{{ message }}</p></div></div>
  <div class="btn-row">
    <a class="btn" href="/">Go to the home page</a>
    {% if not user %}<a class="btn btn--quiet" href="/login">Sign in</a>{% endif %}
  </div>
  <p class="small muted" style="margin-top:18px">Error {{ code }}</p>
</div>
{% endblock %}
