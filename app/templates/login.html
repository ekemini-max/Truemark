{% extends "base.html" %}
{% block title %}Sign in, TrueMark{% endblock %}

{% block content %}
<div class="wrap page">
  <div class="page-head"><div><h1>Sign in</h1><p>For approved schools and TrueMark admins.</p></div></div>
  <form class="form" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <div class="btn-row">
      <button class="btn" type="submit">Sign in</button>
      <a class="btn btn--quiet" href="/signup">Register a school</a>
    </div>
  </form>
</div>
{% endblock %}
